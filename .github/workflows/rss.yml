name: Generate Artmore RSS

on:
  schedule:
    # 매일 자정과 아침 9시에 실행 (UTC 기준 15, 0시)
    - cron: '0 0,15 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 저장소 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요 패키지 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 파이썬 스크립트 실행
      run: python main.py

    - name: 결과물 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add rss.xml
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Artmore RSS feed" && git push)
